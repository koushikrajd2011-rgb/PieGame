
name: Build PieGame EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install pygame-ce pyinstaller

      - name: Build EXE
        run: |
          python -m PyInstaller --onedir --windowed --name PieGame --add-data "assets;assets" piegame.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: PieGame-Windows
          path: dist/PieGame/
